<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11100e">
<title>版醒｜木版年画AR显影书 V2</title>
<link rel="stylesheet" href="./styles.css">
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
<div id="topbar">
  <div class="brand"><b>版醒</b><small> BANXING · WEBAR V2</small></div>
  <div id="progress"><span>版</span><span>印</span><span>画</span><span>生</span></div>
</div>

<div id="intro" class="screen">
 <div class="intro-card">
   <div class="seal">版醒</div>
   <h1>一版 · 一印 · 一画 · 一生</h1>
   <p>扫描四张识别卡，观看木版、墨印、综合色层与文创展台从纸面进入空间。</p>
   <button id="enter" disabled>正在准备 AR…</button>
 </div>
</div>

<div id="scanner" class="scanner hidden">
  <div class="frame"></div>
  <div class="scan-text"><b>寻找识别卡</b><span>将“版 / 印 / 画 / 生”置于框内</span></div>
</div>

<div id="story" class="story hidden">
  <div class="story-head">
    <div><div id="chapter" class="chapter"></div><h2 id="story-title"></h2></div>
    <button id="minimize" aria-label="收起">－</button>
  </div>
  <p id="story-copy"></p>
  <div class="btns">
    <button id="replay">重播动效</button>
    <button id="action">章节互动</button>
  </div>
</div>

<div id="error-screen" class="error-screen hidden">
 <div class="error-card"><h2>AR 启动失败</h2><p id="error-copy"></p><button id="retry">重新启动</button></div>
</div>

<a-scene id="ar-scene"
  mindar-image="imageTargetSrc: ./tracking/targets.mind; maxTrack: 1; autoStart: false; uiLoading: no; uiScanning: no; uiError: no;"
  color-space="sRGB"
  renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  embedded>

  <a-assets>
    <a-asset-item id="banModel" src="./assets/models/ban_relief.glb"></a-asset-item>
    <a-asset-item id="rollerModel" src="./assets/models/yin_roller.glb"></a-asset-item>
    <a-asset-item id="stageModel" src="./assets/models/sheng_stage.glb"></a-asset-item>
    <img id="banDetail" src="./assets/v2/ban_carved_detail.jpg">
    <img id="yinPoster" src="./assets/targets/01_YIN_TARGET.png">
    <img id="huaRed" src="./assets/v2/hua_red.png">
    <img id="huaBlue" src="./assets/v2/hua_blue.png">
    <img id="huaGold" src="./assets/v2/hua_gold.png">
    <img id="huaDark" src="./assets/v2/hua_dark.png">
    <img id="shengProducts" src="./assets/v2/sheng_products.jpg">
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
  <a-light type="ambient" color="#fff1dc" intensity="1.4"></a-light>
  <a-light type="directional" color="#ffe1a8" intensity="1.7" position="-1 2 3"></a-light>

  <!-- 版：真实模型 + 图像纹理 + 光环 -->
  <a-entity id="t0" mindar-image-target="targetIndex:0">
    <a-entity id="banRoot" position="0 0 0.05" scale="0.78 0.78 0.78">
      <a-gltf-model id="ban3d" src="#banModel" rotation="0 0 0"
        animation__rise="property:position; from:0 -0.05 0; to:0 0 0.18; dur:1050; easing:easeOutBack; startEvents:replay0"></a-gltf-model>
      <a-image src="#banDetail" width="0.62" height="0.82" position="0 0 0.24" opacity="0.86"
        animation__glow="property:material.opacity; from:0.25; to:0.94; dur:1150; dir:alternate; loop:true"></a-image>
      <a-torus color="#d6a24c" radius="0.40" radius-tubular="0.012" position="0 0 0.31"
        animation="property:rotation; to:0 0 360; dur:9000; loop:true; easing:linear"></a-torus>
    </a-entity>
  </a-entity>

  <!-- 印：3D滚轮越过真实画面 -->
  <a-entity id="t1" mindar-image-target="targetIndex:1">
    <a-image src="#yinPoster" width="0.72" height="1.08" position="0 0 0.035" opacity="0.96"></a-image>
    <a-plane id="inkReveal" color="#a52f24" opacity="0.34" width="0.68" height="0.95" position="0 -0.03 0.07"
      animation__ink="property:scale; from:1 0.02 1; to:1 1 1; dur:1500; easing:easeOutCubic; startEvents:replay1"></a-plane>
    <a-gltf-model id="roller3d" src="#rollerModel" scale="0.58 0.58 0.58" rotation="0 0 0" position="-0.38 0.28 0.24"
      animation__roll="property:position; from:-0.38 0.28 0.24; to:0.38 -0.18 0.24; dur:1600; easing:easeInOutCubic; startEvents:replay1"></a-gltf-model>
  </a-entity>

  <!-- 画：真实综合色层，拆开/合版 -->
  <a-entity id="t2" mindar-image-target="targetIndex:2">
    <a-image id="h0" src="#huaDark" width="0.70" height="1.05" position="0 0 0.08"></a-image>
    <a-image id="h1" src="#huaRed" width="0.70" height="1.05" position="0 0 0.10"></a-image>
    <a-image id="h2" src="#huaGold" width="0.70" height="1.05" position="0 0 0.12"></a-image>
    <a-image id="h3" src="#huaBlue" width="0.70" height="1.05" position="0 0 0.14"></a-image>
  </a-entity>

  <!-- 生：真实3D微型展台 + 产品影像 -->
  <a-entity id="t3" mindar-image-target="targetIndex:3">
    <a-gltf-model id="stage3d" src="#stageModel" position="0 -0.06 0.10" scale="0.82 0.82 0.82"
      animation__stage="property:rotation; from:0 -8 0; to:0 8 0; dur:2800; dir:alternate; loop:true"></a-gltf-model>
    <a-image src="#shengProducts" width="0.60" height="0.43" position="0 0.20 0.35" opacity="0.92"
      animation__float="property:position; from:0 0.16 0.34; to:0 0.23 0.38; dur:1500; dir:alternate; loop:true"></a-image>
  </a-entity>
</a-scene>
<script src="./app.js"></script>
</body>
</html>
